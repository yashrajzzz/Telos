<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Telos</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon-bw.svg" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="grid-bg"></div>

  <!-- TOP-RIGHT ACTIONS -->
  <div class="fixed top-[18px] right-[20px] z-40 flex items-center gap-2">
    <!-- SETTINGS BUTTON -->
    <button class="top-btn" id="settings-btn" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <!-- GMAIL SHORTCUT -->
    <a class="top-btn" id="gmail-shortcut" href="https://mail.google.com" target="_blank" rel="noopener"
      title="Gmail">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z"
          stroke="currentColor" stroke-width="1.5" />
        <path d="M4 6.5L12 13L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </a>
  </div>

  <main class="relative z-10 max-w-[1520px] mx-auto px-8 pt-12 pb-8 min-h-screen flex flex-col">

    <!-- HERO: clock -->
    <header class="text-center mb-14">
      <p class="font-mono text-blue-2 text-[20px] tracking-[0.02em] m-0 mb-3.5" id="greeting">// good morning, developer</p>
      <div class="font-mono font-bold text-[clamp(56px,11vw,108px)] leading-none text-text tracking-[0.01em] drop-shadow-[0_0_28px_rgba(79,143,247,0.22)] mb-2.5" id="clock">
        <span id="clock-time">00:00<span class="text-blue animate-blink">:</span>00</span>
      </div>
      <p class="font-mono text-[18px] text-text-dim mt-3.5 mb-0" id="gitline">loading…</p>
    </header>

    <!-- PANELS -->
    <section class="flex justify-center flex-wrap gap-6 mt-4 flex-1 items-stretch">

      <!-- TODO -->
      <div class="w-[440px] bg-panel border border-line rounded-xl p-5 flex flex-col gap-4 shadow-sm relative overflow-hidden transition-colors duration-200 hover:border-blue-2" id="panel-todo">
        <div class="flex justify-between items-center pb-2.5 border-b border-dashed border-line">
          <span class="font-mono text-blue font-bold text-[16px]">$ todo --list</span>
          <span class="font-mono text-[13px] text-text-dim" id="todo-count">0 open</span>
        </div>
        <form class="flex items-center gap-2 bg-panel-2 rounded-md px-3 py-2 border border-transparent focus-within:border-line focus-within:shadow-[inset_0_1px_3px_rgba(0,0,0,0.2)] transition-all" id="todo-form" autocomplete="off">
          <span class="text-blue select-none font-bold font-mono">&gt;</span>
          <input type="text" id="todo-input" class="flex-1 bg-transparent border-none outline-none text-text font-sans text-[15px] placeholder:text-text-dim focus-visible:outline-none" placeholder="add a task, hit enter" maxlength="140" spellcheck="false" />
        </form>
        <ul class="list-none m-0 p-0 flex flex-col gap-2 max-h-[300px] overflow-y-auto pr-1" id="todo-list"></ul>
      </div>

      <!-- SHORTCUTS -->
      <div class="w-[440px] bg-panel border border-line rounded-xl p-5 flex flex-col gap-4 shadow-sm relative overflow-hidden transition-colors duration-200 hover:border-blue-2" id="panel-links">
        <div class="flex justify-between items-center pb-2.5 border-b border-dashed border-line">
          <span class="font-mono text-blue font-bold text-[16px]">~/shortcuts</span>
          <button class="add-btn" id="link-add" title="add shortcut">+ new</button>
        </div>
        <div class="grid grid-cols-2 gap-2.5 max-h-[300px] overflow-y-auto pr-0.5" id="links-grid"></div>
      </div>

      <!-- STICKY NOTES -->
      <div class="w-[440px] bg-panel border border-line rounded-xl p-5 flex flex-col gap-4 shadow-sm relative overflow-hidden transition-colors duration-200 hover:border-blue-2" id="panel-notes">
        <div class="flex justify-between items-center pb-2.5 border-b border-dashed border-line">
          <span class="font-mono text-blue font-bold text-[16px]">// sticky-notes</span>
          <button class="add-btn" id="note-add" title="add note">+ new</button>
        </div>
        <div class="flex-1 grid grid-cols-2 grid-rows-2 gap-[14px] p-1 pt-2 overflow-hidden" id="notes-board"></div>
      </div>

    </section>

    <footer class="mt-16 text-center font-mono text-[16px] text-text opacity-85 tracking-wide pointer-events-none">
      <span id="quote">// keep building</span>
    </footer>

  </main>

  <!-- SHORTCUT EDIT/ADD MODAL -->
  <div class="modal-overlay" id="link-modal-overlay">
    <div class="modal" id="link-modal">
      <p class="font-mono text-blue font-bold text-[18px] mb-5 m-0" id="link-modal-title">// new shortcut</p>
      <label class="block font-mono text-[12px] text-text-dim uppercase tracking-[0.1em] mb-1.5" for="link-name-input">shortcut name</label>
      <input type="text" id="link-name-input" class="w-full bg-panel-2 border border-line text-text font-sans text-[15px] p-2.5 rounded-md mb-4 outline-none transition-colors focus-visible:border-blue-2" placeholder="e.g. Figma" maxlength="40"
        spellcheck="false" />
      <label class="block font-mono text-[12px] text-text-dim uppercase tracking-[0.1em] mb-1.5" for="link-url-input">shortcut link</label>
      <input type="text" id="link-url-input" class="w-full bg-panel-2 border border-line text-text font-sans text-[15px] p-2.5 rounded-md mb-6 outline-none transition-colors focus-visible:border-blue-2" placeholder="e.g. figma.com" maxlength="200"
        spellcheck="false" />
      <div class="flex justify-end gap-2.5 mt-2">
        <button class="bg-transparent border border-line text-text-dim px-4 py-2 rounded-md font-sans text-[15px] cursor-pointer transition-colors hover:text-text hover:bg-panel-2" id="link-modal-cancel">cancel</button>
        <button class="bg-blue text-panel font-bold border-none px-4 py-2 rounded-md font-sans text-[15px] cursor-pointer transition-all hover:bg-blue-2" id="link-modal-save">save</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal" id="settings-modal">
      <div class="flex justify-between items-center mb-6">
        <p class="font-mono text-blue font-bold text-[18px] m-0">// settings</p>
        <button class="bg-transparent border-none text-text-dim text-[18px] cursor-pointer px-1.5 py-0.5 rounded leading-none transition-colors hover:text-text" id="settings-close" aria-label="Close settings">✕</button>
      </div>

      <p class="font-mono text-[12px] uppercase tracking-[0.1em] text-text-dim m-0 mb-2.5">general</p>
      <div class="mb-[22px]">
        <input type="text" id="tab-name-input" class="w-full bg-panel-2 border border-line text-text font-sans text-[15px] px-3 py-2 rounded-md outline-none transition-colors focus-visible:border-blue-2" placeholder="Tab Name" autocomplete="off" spellcheck="false" />
      </div>

      <div class="mb-[22px]">
        <label for="hour-format-select" class="block font-mono text-[12px] uppercase tracking-[0.1em] text-text-dim mb-2.5">clock format</label>
        <select id="hour-format-select" class="w-full bg-panel-2 border border-line text-text font-sans text-[15px] px-3 py-2 rounded-md outline-none transition-colors focus-visible:border-blue-2">
          <option value="24h">24 hour</option>
          <option value="12h">12 hour</option>
        </select>
      </div>
    
      <div class="flex justify-between items-center mb-2.5">
        <p class="font-mono text-[12px] uppercase tracking-[0.1em] text-text-dim m-0">background theme</p>
        <span class="font-mono text-[12px] text-blue font-bold tracking-wider" id="current-theme-name">Ash</span>
      </div>
      <div class="theme-swatches grid grid-cols-4 gap-2 mb-[22px]" id="theme-swatches">
        <!-- populated dynamically by JS -->
      </div>

      <p class="font-mono text-[12px] uppercase tracking-[0.1em] text-text-dim m-0 mb-2.5">panels</p>
      <div class="flex flex-col gap-1 mb-[22px]">
        <label class="flex justify-between items-center py-1.5 cursor-pointer group" for="toggle-todo">
          <span class="font-mono text-[15px] text-text transition-colors group-hover:text-blue-2">$ todo --list</span>
          <span class="toggle-switch relative inline-block w-[38px] h-[21px]">
            <input type="checkbox" id="toggle-todo" class="sr-only" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
        <label class="flex justify-between items-center py-1.5 cursor-pointer group" for="toggle-shortcuts">
          <span class="font-mono text-[15px] text-text transition-colors group-hover:text-blue-2">~/shortcuts</span>
          <span class="toggle-switch relative inline-block w-[38px] h-[21px]">
            <input type="checkbox" id="toggle-shortcuts" class="sr-only" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
        <label class="flex justify-between items-center py-1.5 cursor-pointer group" for="toggle-notes">
          <span class="font-mono text-[15px] text-text transition-colors group-hover:text-blue-2">// sticky-notes</span>
          <span class="toggle-switch relative inline-block w-[38px] h-[21px]">
            <input type="checkbox" id="toggle-notes" class="sr-only" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
