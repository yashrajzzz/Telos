<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Telos</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grid-bg"></div>

  <!-- TOP BROWSER TAB BAR -->
  <header class="top-nav-bar" id="top-nav-bar">
    <div class="top-nav-inner">
      <!-- Mode selector -->
      <div class="top-modes-group" id="top-modes-group" role="tablist" aria-label="Tab View Modes">
        <button class="top-mode-btn active" data-mode="frequent" id="mode-frequent" role="tab" aria-selected="true" title="Frequently opened websites">
          <svg class="mode-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <span class="mode-label">frequently opened</span>
        </button>
        <button class="top-mode-btn" data-mode="recent" id="mode-recent" role="tab" aria-selected="false" title="Previously opened tabs / recent history">
          <svg class="mode-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="mode-label">previously opened</span>
        </button>
        <button class="top-mode-btn" data-mode="open" id="mode-open" role="tab" aria-selected="false" title="Currently open browser tabs">
          <svg class="mode-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          <span class="mode-label">open tabs</span>
        </button>
      </div>

      <!-- Browser Tabs Strip Container -->
      <div class="top-tabs-wrapper">
        <button class="tab-scroll-btn left" id="tabs-scroll-left" aria-label="Scroll tabs left" title="Scroll left">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="top-tabs-track" id="top-tabs-track">
          <!-- Dynamically populated tab pills -->
        </div>
        <button class="tab-scroll-btn right" id="tabs-scroll-right" aria-label="Scroll tabs right" title="Scroll right">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- Top Nav Utilities -->
      <div class="top-nav-actions">
        <button class="top-action-btn" id="tabs-refresh-btn" title="Refresh tabs" aria-label="Refresh tabs">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <a class="top-action-btn gmail-btn" id="gmail-shortcut" href="https://mail.google.com" target="_blank" rel="noopener" title="Gmail">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 6.5L12 13L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- HERO: clock -->
    <header class="hero">
      <p class="greeting" id="greeting">// good morning, developer</p>
      <div class="clock" id="clock">
        <span id="clock-time">00:00<span class="cursor">:</span>00</span>
      </div>
      <p class="gitline" id="gitline">loading…</p>
    </header>

    <!-- SEARCH -->
    <form class="searchbar" id="searchbar" autocomplete="off">
      <span class="chevron">&gt;</span>
      <input type="text" id="search-input" placeholder="search the web <3" spellcheck="false" />
      <button type="submit" class="search-go" title="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <!-- PANELS -->
    <section class="panels">

      <!-- TODO -->
      <div class="panel" id="panel-todo">
        <div class="panel-head">
          <span class="prompt">$ todo --list</span>
          <span class="count" id="todo-count">0 open</span>
        </div>
        <form class="todo-form" id="todo-form" autocomplete="off">
          <span class="chevron">&gt;</span>
          <input type="text" id="todo-input" placeholder="add a task, hit enter" maxlength="140" spellcheck="false" />
        </form>
        <ul class="todo-list" id="todo-list"></ul>
      </div>

      <!-- SHORTCUTS -->
      <div class="panel" id="panel-links">
        <div class="panel-head">
          <span class="prompt">~/shortcuts</span>
          <button class="add-btn" id="link-add" title="add shortcut">+ new</button>
        </div>
        <div class="links-grid" id="links-grid"></div>
      </div>

      <!-- STICKY NOTES -->
      <div class="panel" id="panel-notes">
        <div class="panel-head">
          <span class="prompt">// sticky-notes</span>
          <button class="add-btn" id="note-add" title="add note">+ new</button>
        </div>
        <div class="notes-board" id="notes-board"></div>
      </div>

    </section>

    <footer class="foot">
      <span id="quote">// keep building</span>
    </footer>

  </main>

  <!-- SHORTCUT EDIT/ADD MODAL -->
  <div class="modal-overlay" id="link-modal-overlay">
    <div class="modal" id="link-modal">
      <p class="modal-title" id="link-modal-title">// new shortcut</p>
      <label class="modal-label" for="link-name-input">shortcut name</label>
      <input type="text" id="link-name-input" class="modal-input" placeholder="e.g. Figma" maxlength="40" spellcheck="false" />
      <label class="modal-label" for="link-url-input">shortcut link</label>
      <input type="text" id="link-url-input" class="modal-input" placeholder="e.g. figma.com" maxlength="200" spellcheck="false" />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="link-modal-cancel">cancel</button>
        <button class="modal-btn save" id="link-modal-save">save</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
